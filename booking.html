<!DOCTYPE html>
<html>
<head>
    <title>IPL Ticket Booking</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>

<center>
    <h1>🏏 IPL 2026 TICKET BOOKING</h1>
    <h3>Book Your Match Tickets Online</h3>
</center>

<hr>

<h2 id="bookingHeading">Ticket Reservation Form</h2>

<form id="bookingForm">

    <label>Enter Your Name:</label><br>
    <input type="text" id="username"
           placeholder="Enter your name"
           minlength="3" maxlength="30" required>

    <br><br>

    <label>Enter Email:</label><br>
    <input type="email" id="email"
           placeholder="Enter your email" required>

    <br><br>

    <label>Enter Mobile Number:</label><br>
    <input type="tel" id="mobile"
           placeholder="10 digit mobile number"
           pattern="[0-9]{10}"
           maxlength="10" required>

    <br><br>

    <label>Choose Match:</label><br>
    <select id="bookingMatch" required>
        <option value="">Select Match</option>
        <option>RCB vs CSK</option>
        <option>MI vs KKR</option>
        <option>SRH vs DC</option>
        <option>RR vs PBKS</option>
        <option>CSK vs MI</option>
    </select>

    <br><br>

    <label>Ticket Quantity:</label><br>
    <input type="number" id="count"
           min="1" max="5" required>

    <br><br>

    <label>Ticket Category:</label><br>
    <select id="type" required>
        <option value="">Select Category</option>
        <option value="1000">Regular - ₹1000</option>
        <option value="2000">Premium - ₹2000</option>
        <option value="3500">VIP - ₹3500</option>
    </select>

    <br><br>

    <label>Seating Preference:</label><br>

    <input type="radio" name="preference" value="Indoor">
    Indoor

    <input type="radio" name="preference" value="Outdoor">
    Outdoor

    <br><br>

    <input type="checkbox" required>
    I agree to the terms and conditions.

    <br><br>

    <button type="submit">Confirm Booking</button>
    <button type="reset">Reset</button>

</form>

<p id="confirmation"></p>

<div class="summary-card">

    <h2>Booking Summary</h2>

    <p>Selected Match: <span id="summaryMatch">Not selected</span></p>

    <p>Stand Category: <span id="summaryStand">Not selected</span></p>

    <p>Ticket Quantity: <span id="summaryQuantity">0</span></p>

    <h3>Total Price: ₹<span id="summaryTotal">0</span></h3>

</div>

</body>
</html>
